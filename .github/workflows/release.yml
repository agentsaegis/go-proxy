name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

jobs:
  verify-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI passed on this SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          echo "Checking CI status for $COMMIT_SHA on $REPO"
          LINT=$(gh api "repos/$REPO/commits/$COMMIT_SHA/check-runs" \
            --jq '.check_runs[] | select(.name == "Lint") | .conclusion' 2>/dev/null | head -1 || true)
          TESTS=$(gh api "repos/$REPO/commits/$COMMIT_SHA/check-runs" \
            --jq '.check_runs[] | select(.name == "Tests") | .conclusion' 2>/dev/null | head -1 || true)
          if [ "$LINT" != "success" ] || [ "$TESTS" != "success" ]; then
            echo "::error::CI has not passed on $COMMIT_SHA (Lint: ${LINT:-not found}, Tests: ${TESTS:-not found}). Push to main and wait for CI before tagging."
            exit 1
          fi
          echo "CI passed on $COMMIT_SHA (Lint: $LINT, Tests: $TESTS)"

  goreleaser:
    needs: [verify-ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
